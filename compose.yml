volumes:
  snort_log:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g,uid=1000
  snort_data:

services:
  snort:
    build:
      context: .
      dockerfile: dockerfiles/debian.dockerfile
    image: ghcr.io/mata-elang-stable/snort3-docker-image:v2.0-debian-fix
    # restart: unless-stopped
    # network_mode: host
    environment:
      SNORT_OINKCODE: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      NETWORK_INTERFACE: eth0
      DOWNLOAD_RULES: false
      SNORT_COMPRESSED_RULES_FILE_PATH: #if you have have rules.zip at directory rules give value /tmp/rules
      COMMUNITY_RULESET: false
      REGISTERED_RULESET: false
      LIGHTSPD_RULESET: false
      SNORT_BLOCKLIST: false
      ET_BLOCKLIST: false
      BLOCKLIST_URLS:
      IPS_POLICY: balanced
    volumes:
      - snort_log:/var/log/snort:rw
      - ./rules/custom.rules:/usr/local/etc/snort3/rules/local.rules
      - snort_data:/usr/local/etc/snort3
      - ./rules:/tmp/rules
      # - ./conf/snort.lua:/usr/local/etc/snort/snort.lua:ro
    deploy:
      mode: replicated
      replicas: 1
      # restart_policy:
      #   condition: unless-stopped
      #   delay: 10s
      resources:
        limits:
          cpus: "1"
          memory: 512M